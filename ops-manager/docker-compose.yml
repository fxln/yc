services:
  ops-manager:
    build:
      context: .
      dockerfile: Dockerfile
    image: ops-manager:latest
    container_name: ops-manager
    restart: unless-stopped
    # 端口：HTTP(网页) / WebDAV
    ports:
      - "3000:3000"
      - "8081:8081"
    # 环境变量（可覆盖默认值）
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - HTTP_PORT=3000
      - WEBDAV_PORT=8081
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - JWT_SECRET=please-change-me-in-production-xxxxxxxx
      - HOST_SECRET=please-change-me-host-secret-key-32bytes!!
    # 数据持久化：SQLite 数据库、日志、WebDAV 根目录、SSH 私钥
    volumes:
      - ops_data:/app/data
    # 健康检查
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # 网络（host 网络可直连内网主机）
    # network_mode: host  # 如需访问宿主机内网资源，取消注释
    networks:
      - ops-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  ops_data:
    driver: local

networks:
  ops-net:
    driver: bridge
